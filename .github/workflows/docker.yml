# Builds the image from the published npm packages and pushes it to ghcr.io on every version
# tag (v0.1.9) and on demand.
name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'shibaox version on npm (default: latest)'
        default: latest
      latest:
        description: 'also move the latest tag'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: wait for the version and every package of the monorepo on npm (a tag may arrive before the publish propagates)
        run: |
          v="${{ steps.v.outputs.version }}"
          # every published workspace package, from this checkout (transitive ones included: shibaox-view once lagged)
          names="$(node -e 'const fs=require("fs");for (const d of ["packages","apps"]) for (const p of fs.readdirSync(d)) { try { const j=JSON.parse(fs.readFileSync(`${d}/${p}/package.json`,"utf8")); if (!j.private) console.log(j.name) } catch {} }')"
          for i in $(seq 1 80); do
            ok=1
            for n in $names; do
              # the metadata shows a version minutes before its tarball is served: wait for the tarball itself
              base="${n#@wizardingcode/}"
              curl -fsSL -o /dev/null "https://registry.npmjs.org/$n/-/$base-$v.tgz" || { ok=0; echo "waiting for $n@$v"; break; }
            done
            [ "$ok" = 1 ] && exit 0
            sleep 15
          done
          echo "shibaox@$v (or one of its packages) is not on npm" >&2; exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SHIBAOX_VERSION=${{ steps.v.outputs.version }}
          # `latest` moves only with a tag push: a dispatch of an older version never rolls it back
          tags: |
            ghcr.io/wizardingcode-io/shibaox:${{ steps.v.outputs.version }}
            ${{ (github.event_name == 'push' || inputs.latest) && 'ghcr.io/wizardingcode-io/shibaox:latest' || '' }}
