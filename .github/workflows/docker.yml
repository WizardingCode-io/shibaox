# Builds the image from the published npm packages and pushes it to ghcr.io on every version
# tag (v0.1.9) and on demand.
name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'shibaox version on npm (default: latest)'
        default: latest
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: wait for the version on npm (a tag may arrive before the publish propagates)
        run: |
          v="${{ steps.v.outputs.version }}"
          for i in $(seq 1 40); do
            if npm view "shibaox@$v" version >/dev/null 2>&1; then exit 0; fi
            sleep 15
          done
          echo "shibaox@$v is not on npm" >&2; exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SHIBAOX_VERSION=${{ steps.v.outputs.version }}
          # `latest` moves only with a tag push: a dispatch of an older version never rolls it back
          tags: |
            ghcr.io/wizardingcode-io/shibaox:${{ steps.v.outputs.version }}
            ${{ github.event_name == 'push' && 'ghcr.io/wizardingcode-io/shibaox:latest' || '' }}
