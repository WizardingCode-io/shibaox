# Builds the macOS desktop app (dmg, arm64 + x64) on every version tag and on demand, and
# attaches it to a DRAFT release of that tag: nothing goes public until the release is published.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to build and attach to (v0.2.3)'
        required: true
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # only the desktop app and what it needs (the terminal dashboard's build wants Bun)
      - run: pnpm turbo run build --filter=@wizardingcode/shibaox-desktop...
      - run: pnpm --filter @wizardingcode/shibaox-desktop test
      # With the Apple secrets set (see the wiki, Development: "Signing and notarizing"), the app
      # is signed with Developer ID and notarized, so it opens like any other app. Without them
      # it is signed ad hoc (Gatekeeper asks for "Open Anyway" once).
      - name: package the dmg
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # a missing secret arrives as an empty variable
          for v in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ -n "${APPLE_CERTIFICATE_P12:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ]; then
            # the certificate goes into a keychain of its own (electron-builder 26 imports a
            # CSC_LINK with the wrong keychain password, so the keychain is made here)
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KC_PW="$(openssl rand -hex 16)"
            echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KC_PW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            security find-identity -v -p codesigning "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" CSC_KEYCHAIN="$KEYCHAIN"
            cd apps/desktop
            pnpm exec electron-builder --mac --publish never -c.mac.notarize=true
            echo "signed=notarized" >> "$GITHUB_ENV"
          else
            echo "no Apple secrets: signing ad hoc"
            cd apps/desktop
            pnpm exec electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
            echo "signed=adhoc" >> "$GITHUB_ENV"
          fi
      - name: check the signature
        run: |
          app="$(ls -d apps/desktop/release/mac-arm64/*.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$signed" = notarized ]; then spctl --assess --type execute --verbose=2 "$app"; fi
      - name: attach to a draft release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apps/desktop/release/Shibaox-*.dmg --clobber
          else
            gh release create "$TAG" --draft --title "shibaox ${TAG#v}" \
              --notes "$( [ "$signed" = notarized ] && echo "Shibaox desktop app for macOS (signed and notarized)." || echo "Shibaox desktop app for macOS (not notarized: allow it once under System Settings, Privacy and Security, Open Anyway).") The CLI and daemon: npm i -g shibaox@${TAG#v}" \
              apps/desktop/release/Shibaox-*.dmg
          fi
