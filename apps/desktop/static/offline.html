<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Shibaox</title>
    <link rel="stylesheet" href="app/design-system/tokens.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: var(--color-surface, #faf7f2); color: var(--color-text, #1a1a1a);
        font-family: var(--font-sans, 'Geist', system-ui, sans-serif);
      }
      main { max-width: 460px; padding: 32px; }
      h1 { font-family: var(--font-display, 'Bricolage Grotesque', var(--font-sans, system-ui)); font-size: 22px; margin: 0 0 12px; }
      p { line-height: 1.5; margin: 0 0 12px; color: var(--color-text-muted, #555); }
      code { font-family: var(--font-mono, 'Geist Mono', ui-monospace, monospace); font-size: 13px; background: var(--color-surface-sunken, #f0ece4); padding: 2px 6px; border-radius: 6px; }
      a.button {
        display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 10px; text-decoration: none;
        background: var(--color-accent, #f97316); color: var(--color-on-accent, #fff); font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shibaox cannot reach a daemon</h1>
      <p id="reason">The shibaox daemon is not running.</p>
      <p>Start it in a terminal with <code>shibaox daemon start</code> (install it first with <code>npm i -g shibaox</code>), or point this app at a remote daemon with <code>shibaox remote set &lt;url&gt; &lt;token&gt;</code>.</p>
      <a class="button" href="shibaox-desktop://retry">Try again</a>
    </main>
    <script>
      const reason = new URLSearchParams(location.search).get('reason');
      if (reason) document.getElementById('reason').textContent = reason;
    </script>
  </body>
</html>
